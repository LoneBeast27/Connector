name: Integration (FFAPI + Launchpad + Connector + mixin audit + server smoke test)

# Fork-only pipeline for the 26.3 port, built to surface EVERY problem per run (see CLAUDE.md):
#  - FFAPI / Launchpad are rebuilt only when their commit changes (actions/cache keyed on SHAs)
#  - a static mixin audit checks all mixins of all three projects against NeoForge-patched Minecraft
#  - a lenient server boot (-Dmixin.ignoreRequired) collects all runtime mixin/linkage failures at once
#  - strict boots (Connector only, then + Fabric mods) gate the result
# Results land on the ci/<branch> git branch so they can be read with a plain `git fetch`.

on:
  push:
    branches: [ '26.3.x' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BRANCH: 26.3.x
  MC_VERSION: '26.3'
  NEOFORGE_VERSION: 26.3.0.100
  ASM_VERSION: '9.8'
  # Fabric mods (Modrinth project slugs) loaded on the smoke-test server. Server-safe picks only.
  SMOKE_MODS: 'cloth-config fabric-language-kotlin appleskin jade ferrite-core lithium'

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Connector
        uses: actions/checkout@v4
        with: { fetch-depth: 0, fetch-tags: true, path: connector }

      - name: Checkout Forgified Fabric API
        uses: actions/checkout@v4
        with: { repository: LoneBeast27/ForgifiedFabricAPI, ref: '${{ env.BRANCH }}', fetch-depth: 0, path: ffapi }

      - name: Checkout Launchpad
        uses: actions/checkout@v4
        with: { repository: LoneBeast27/Launchpad, ref: '${{ env.BRANCH }}', fetch-depth: 0, path: launchpad }

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with: { distribution: 'microsoft', java-version: '25' }

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Non-default branch: allow writing the Gradle/NFRT cache so MC isn't re-decompiled every run.
          cache-read-only: false

      - name: Prepare report dir + SHAs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/report/logs" "$RUNNER_TEMP/report/jars" && echo "REPORT=$RUNNER_TEMP/report" >> $GITHUB_ENV
          echo "FFAPI_SHA=$(git -C ffapi rev-parse HEAD)" >> $GITHUB_ENV
          echo "LAUNCHPAD_SHA=$(git -C launchpad rev-parse HEAD)" >> $GITHUB_ENV

      - name: Restore FFAPI build (by FFAPI SHA)
        id: ffapi-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/sinytra/forgified-fabric-api
            ffapi/build/libs
          key: ffapi-${{ env.FFAPI_SHA }}

      - name: Build FFAPI
        id: ffapi
        if: steps.ffapi-cache.outputs.cache-hit != 'true'
        working-directory: ffapi
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ~/.gradle/caches/fabric-loom/assets
          ./gradlew publishToMavenLocal --stacktrace --continue --build-cache -x test 2>&1 | tee "$REPORT/logs/ffapi-build.log"

      - name: Restore Launchpad build (by Launchpad + FFAPI SHA)
        id: launchpad-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/sinytra/launchpad
            launchpad/build/libs
          key: launchpad-${{ env.LAUNCHPAD_SHA }}-${{ env.FFAPI_SHA }}

      - name: Build Launchpad
        id: launchpad
        if: steps.launchpad-cache.outputs.cache-hit != 'true'
        working-directory: launchpad
        shell: bash
        env:
          # Publish under the plain version (no +dev-<hash>) so Connector's pinned launchpad version resolves.
          PUBLISH_RELEASE_TYPE: BETA
        run: |
          set -o pipefail
          ./gradlew publishToMavenLocal --stacktrace --continue --build-cache -x test 2>&1 | tee "$REPORT/logs/launchpad-build.log"

      - name: Build Connector
        id: connector
        working-directory: connector
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build publishToMavenLocal --stacktrace --continue --build-cache -x test 2>&1 | tee "$REPORT/logs/connector-build.log"

      - name: Collect jars
        if: ${{ always() }}
        shell: bash
        run: |
          # FFAPI: root merged jar. Launchpad/Connector: the "-full" jars (their primary artifacts).
          find ffapi/build/libs -maxdepth 1 -name 'forgified-fabric-api-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp {} "$REPORT/jars/" \; 2>/dev/null || true
          find launchpad/build/libs -maxdepth 1 -name '*-full.jar' -exec cp {} "$REPORT/jars/" \; 2>/dev/null || true
          find connector/build/libs -maxdepth 1 -name '*-full.jar' -exec cp {} "$REPORT/jars/" \; 2>/dev/null || true
          ls -la "$REPORT/jars"
          echo "JAR_COUNT=$(ls "$REPORT"/jars/*.jar 2>/dev/null | wc -l)" >> $GITHUB_ENV

      - name: Install NeoForge server
        if: ${{ always() && env.JAR_COUNT == '3' }}
        shell: bash
        run: |
          mkdir -p server && cd server
          curl -fsSL -o installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}-installer.jar"
          java -jar installer.jar --install-server . > "$REPORT/logs/neoforge-install.log" 2>&1
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nview-distance=4\nsimulation-distance=4\n' > server.properties

      - name: Static mixin audit (all mixins, client + server)
        if: ${{ always() && env.JAR_COUNT == '3' }}
        shell: bash
        run: |
          mkdir -p audit && cd audit
          for a in asm asm-tree; do curl -fsSL -o $a.jar "https://repo1.maven.org/maven2/org/ow2/asm/$a/${ASM_VERSION}/$a-${ASM_VERSION}.jar"; done
          # Target classpath, highest priority first: NeoForge-patched/merged Minecraft (client+server) from the
          # ModDevGradle/NFRT outputs, then the server install, then the NeoForge jar and libraries.
          {
            find "$GITHUB_WORKSPACE"/connector/build "$GITHUB_WORKSPACE"/ffapi/build ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iE 'neoforge-26\.3[^/]*(merged|client)|minecraft[^/]*(patched|merged)|/moddev/artifacts/' | grep -viE 'sources|javadoc' | sort -u
            find "$GITHUB_WORKSPACE"/server/libraries -name '*.jar' 2>/dev/null | grep -iE 'patched|neoforge' | sort -u
            find "$GITHUB_WORKSPACE"/server/libraries -name '*.jar' 2>/dev/null | sort -u
          } | awk '!seen[$0]++' > targets.txt
          cp targets.txt "$REPORT/logs/mixin-audit-classpath.txt"
          java -cp asm.jar:asm-tree.jar "$GITHUB_WORKSPACE/connector/.github/tools/MixinAudit.java" targets.txt "$REPORT/logs/mixin-audit.txt" "$REPORT"/jars/*.jar \
            2>&1 | tee "$REPORT/logs/mixin-audit-run.log" || true

      - name: Download Fabric smoke-test mods
        if: ${{ always() && env.JAR_COUNT == '3' }}
        shell: bash
        run: |
          mkdir -p fabric-mods
          for slug in $SMOKE_MODS; do
            url=$(curl -fsSL "https://api.modrinth.com/v2/project/$slug/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${MC_VERSION}%22%5D" \
              | python3 -c 'import json,sys; v=json.load(sys.stdin); print(v[0]["files"][0]["url"] if v else "")')
            if [ -n "$url" ]; then curl -fsSL -o "fabric-mods/$slug.jar" "$url" && echo "$slug: $url" >> "$REPORT/logs/fabric-mods.txt";
            else echo "$slug: no fabric build for $MC_VERSION" >> "$REPORT/logs/fabric-mods.txt"; fi
          done
          cat "$REPORT/logs/fabric-mods.txt"

      - name: Lenient boot - collect ALL runtime failures (Connector + Fabric mods, mixin.ignoreRequired)
        if: ${{ always() && env.JAR_COUNT == '3' }}
        shell: bash
        run: |
          cd server && rm -rf mods world logs crash-reports && mkdir mods
          cp "$REPORT"/jars/*.jar mods/ && cp ../fabric-mods/*.jar mods/ 2>/dev/null || true
          printf -- '-Dmixin.ignoreRequired=true\n-Dmixin.dumpTargetOnFailure=true\n-Dmixin.debug.verbose=false\n' > user_jvm_args.txt
          bash "$GITHUB_WORKSPACE/connector/.github/scripts/run-server.sh" "$REPORT/logs/server-lenient" || true
          : > user_jvm_args.txt   # run.sh requires the file to exist
          bash "$GITHUB_WORKSPACE/connector/.github/scripts/summarize-runtime.sh" "$REPORT/logs/server-lenient" > "$REPORT/logs/runtime-issues.txt" || true

      - name: Strict boot - Connector only
        if: ${{ always() && env.JAR_COUNT == '3' }}
        shell: bash
        run: |
          cd server && rm -rf mods world logs crash-reports && mkdir mods
          cp "$REPORT"/jars/*.jar mods/
          bash "$GITHUB_WORKSPACE/connector/.github/scripts/run-server.sh" "$REPORT/logs/server-baseline" || true

      - name: Strict boot - with Fabric mods
        if: ${{ always() && env.JAR_COUNT == '3' }}
        shell: bash
        run: |
          cd server && rm -rf mods world logs crash-reports && mkdir mods
          cp "$REPORT"/jars/*.jar mods/ && cp ../fabric-mods/*.jar mods/ 2>/dev/null || true
          bash "$GITHUB_WORKSPACE/connector/.github/scripts/run-server.sh" "$REPORT/logs/server-fabric" || true

      - name: Publish CI report branch
        if: ${{ always() }}
        shell: bash
        run: |
          cd "$REPORT"
          for f in logs/*-build.log; do [ -f "$f" ] && grep -nE '^e: |error:|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong|Could not' "$f" | head -400 > "${f%.log}.errors.txt"; done
          cat > STATUS <<EOT
          commit=${GITHUB_SHA}
          run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          ffapi_sha=${FFAPI_SHA}
          launchpad_sha=${LAUNCHPAD_SHA}
          ffapi=${{ steps.ffapi.outcome }} (cache-hit=${{ steps.ffapi-cache.outputs.cache-hit }})
          launchpad=${{ steps.launchpad.outcome }} (cache-hit=${{ steps.launchpad-cache.outputs.cache-hit }})
          connector=${{ steps.connector.outcome }}
          mixin_audit=$(grep -oE 'ISSUES: [0-9]+' logs/mixin-audit.txt 2>/dev/null || echo not-run)
          runtime_issues=$(grep -c . logs/runtime-issues.txt 2>/dev/null || echo not-run)
          server_lenient=$(cat logs/server-lenient/RESULT 2>/dev/null || echo not-run)
          server_baseline=$(cat logs/server-baseline/RESULT 2>/dev/null || echo not-run)
          server_fabric=$(cat logs/server-fabric/RESULT 2>/dev/null || echo not-run)
          EOT
          git init -q -b report && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "CI ${GITHUB_SHA::9}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "report:refs/heads/ci/${GITHUB_REF_NAME}"
